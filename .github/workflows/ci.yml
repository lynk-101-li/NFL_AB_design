name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e .

      - name: Compile sources
        run: python -m py_compile src/nfl_ab_design/workflow.py src/nfl_ab_design/__main__.py scripts/run_nfl_ab_design.py scripts/verify_model_components.py

      - name: Verify pinned model registry and gitlinks
        run: python scripts/verify_model_components.py --allow-uninitialized

      - name: Run workflow tests
        run: python -m unittest discover -s tests

      - name: Run command-line workflow
        run: python scripts/run_nfl_ab_design.py
