[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-ab-design"
version = "0.2.2"
description = "Reproducible epitope-conditioned NfL antibody de novo design campaign and real-model handoff."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "NFL antibody design project"}
]
dependencies = [
  "numpy>=1.24",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.scripts]
nfl-ab-design = "nfl_ab_design.workflow:main"

[tool.setuptools.packages.find]
where = ["src"]
